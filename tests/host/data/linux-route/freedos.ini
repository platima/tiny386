; FreeDOS from the hard disk image: the first thing to try on the board.
; Paths are from the directory the emulator is started in.

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; FreeDOS needs very little; the less asked for, the less can go wrong
mem_size = 2M
vga_mem_size = 256K
hda = freedos-hd.img
fill_cmos = 1

[display]
; the size of the panel.  On the frame buffer console the emulator uses the
; size of the screen whatever is said here, and says so if the two differ.
width = 800
height = 480

[cpu]
; 3, 4, 5 or 6: 386, 486, 586 or 686
gen = 4
; no x87: everything on this board is soft float, the emulator included
fpu = 0
