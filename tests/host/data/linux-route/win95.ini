; Windows 95 on the board, from an image made on the PC (DISK-IMAGES.txt).
; Not tried: there was no Windows to try it with.

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; What the guest gets is what the board has to have free, to the kilobyte,
; plus up to 1 MB for the emulator.  The emulator says what the board has
; before it starts and stops if this is more; README.md has the sums.
; tiny386's own boards give Windows 95 6M and 7568K.
mem_size = 4M
; 640x480 in 16 colours, which is what Windows' standard VGA driver wants,
; needs 154K
vga_mem_size = 256K
; on the partition added to the card for it
hda = /mnt/win/win95.img
; stops Windows falling back to "MS-DOS compatibility mode" for the disk
fill_cmos = 1

[display]
width = 800
height = 480

[cpu]
; as on the PC the image was made on
gen = 3
fpu = 0
