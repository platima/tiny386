; FreeDOS with 4M, for BENCH.COM on the FreeDOS image, which wants 4 MB:
;   tiny386 -term -marks bench.ini      and at the C:\> prompt: bench
; The emulator times each piece of BENCH's work and ends when it is done.

[pc]
bios = bios.bin
vga_bios = vgabios.bin
mem_size = 4M
vga_mem_size = 256K
hda = freedos-hd.img
fill_cmos = 1

[display]
width = 800
height = 480

[cpu]
gen = 4
fpu = 0
