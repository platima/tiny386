; The DOS board's own settings, for tiny386 v3 (app version v3.5, BOARD=dosboard)
; Put this file in the card's tiny386 folder (or the card's top folder).  It
; is read before the picture starts, so it is not one of the inis the boot
; menu offers.  Every line is optional; the values below are the defaults.
; The PC itself (BIOS, memory, disks) is set in the other inis, as on the
; Korvo-1: copy tiny386.ini and win95-14m.ini from ..\..\card\tiny386.
; Words may be in any case; 0 and 1 may also be no and yes, off and on.  A
; value that cannot be read is named on the console and the default kept.

[dosboard]
; MS7210 register 0x1281 bits 2:0, the edge it samples the pixel data on,
; and pclk_neg below, the edge the S31 sends it on.  ESP-IDF describes
; pclk_neg two ways (its header: data out on the falling edge; its
; register description and low-level driver: data out on the rising edge,
; sampled on the falling one).  The default follows the register
; description: the S31 launches on the rising edge and the MS7210, with
; PCLK inverted (4), samples on the falling one.  If the picture sparkles
; or shifts, try the four pairs in this order, one at a time:
;   pclk_neg = 1, pclk_phase = 4   (the default)
;   pclk_neg = 0, pclk_phase = 0   (the other opposite-edge pair)
;   pclk_neg = 1, pclk_phase = 0   (encoder.md section 9's plan A)
;   pclk_neg = 0, pclk_phase = 4
; Both reference register tables (Loongson, Meyesemi) use pclk_phase 4.
; 5 to 7 are 4 with a delay: once a pair gives a clean picture, a pair
; whose delays 5 to 7 are clean too has the most margin.  One digit, 0 to 7.
pclk_phase = 4
; 1: ESP-IDF's pclk_active_neg, as the Korvo-1 panel runs (which edge that
; launches on is described both ways above); 0: the other edge.
pclk_neg = 1
; 1: red and blue swapped inside the MS7210 (register 0x1201 bit 4), for a
; colour card whose second bar is red and fifth blue.
rb_swap = 0
; auto: DVI for a monitor whose EDID has no HDMI block, else HDMI (also
; when the EDID's second block cannot be read; DVI when its one extension
; block reads well but is not a CEA-861 block).  hdmi or dvi forces one.
hdmi_mode = auto
; 0: HDMI without sound (from rev A2 the line out still plays, and from
; rev A2c the speakers: LINE-OUT.md)
hdmi_audio = 1
; The I2S slot width: 16, or 32 if the MS7210 wants 64 bit clocks a frame
; (16-bit samples either way; with 32, word select is high for a whole
; slot of 32 bit clocks).  If there is no sound: first unplug and
; plug in the HDMI cable once (that starts the MS7210's audio again with
; the sound already running), then try 32.  Both suit the line out's
; PCM5102A (rev A2).
i2s_slot_bits = 16
; Sound level, 0 to 8: the mix is divided by 2 to this power.  2 (since
; v3.5) is the loudest at which nothing can clip, even with the SB16, the
; AdLib and the PC speaker all at full scale together; HDMI, the line out
; and the speakers (rev A2c) all get it.  1 is twice as loud and 0 four
; times, but loud mixes are then held at full scale (the UART counts them)
; and the speakers clip; 3 is half as loud, 4 a quarter (tiny386's own and
; v3.4's).  A full-scale sound at 2 gives about 0.53 V RMS at the line out.
audio_shift = 2
; 0: the RGB output reads the frame buffer in PSRAM directly.  If the
; picture tears or shifts, 8000 (two buffers of ten lines in internal RAM).
; It must divide 480000, and is held to 8000 at most; if the output will
; not start with it, it starts again without.  Since v5.1 those 31 KiB are
; more than internal RAM has spare: with 8000, use an app built with
; I386_EXEC1_SMALL (BUILD-NOTES.md 34.8).
lcd_bounce_px = 0
; how long the colour bars stay at start, in ms; 0 for none
test_card_ms = 2000
; the CH9350L's working state: 2, or 0 as a fallback for a keyboard or
; mouse that misbehaves in state 2 (in state 0 only boot-layout keyboard
; reports are used)
ch9350_state = 2
; 0 (off), or a few ms, 50 at most: an all-zero keyboard frame this soon
; after a mouse frame is ignored (only if held keys are let go while the
; mouse moves)
kbd_zero_guard_ms = 0
