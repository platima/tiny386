; Windows 95 OSR2 at the DOS board's own size, 800x600 (v4.1)
; For tiny386 v4.1 bare metal on the DOS board, with VMDisp9x's display
; driver (TEST-PLAN.md 13, 13e: what to install and how; VBE600.REG from
; vbe-reg.img in step 13c).  The Korvo-1's is win95-800x480.ini.  Put it in
; the card's tiny386 folder beside tiny386.ini and win95-14m.ini (copied
; from ..\..\card\tiny386\, with bios.bin, vgabios.bin and vbe-reg.img);
; the boot menu lists it.
;
; The firmware mounts every FAT partition of the card: the first at /sdcard,
; each other one at /sdcardN, N its number in the partition table.  On a
; card laid out as the Korvo-1's, the WIN9X partition is the third, so
; /sdcard3.  Once the driver is in this image, start it with this ini only:
; with win95-14m.ini's 320K Windows falls back to 640x480, as on the
; Korvo-1 (TEST-PLAN.md 13c).

[esp]
console = 2
enable_usb = 1
; the status LED's brightness, 0 to 255; 9 without this line (tiny386.ini)
;led_brightness = 9
; v3.8: each line below is what it is without the line (tiny386.ini says
; more; TEST-PLAN.md 8 for Windows 95)
;uart_log = 0
;verbose_log = 0
;timer_catchup = 1
;fast_seek = 1
;memtest = 0
; v4.0: 1 draws a VBE picture (Windows at 800x600) again only where Windows
; wrote into video memory; 0 draws all of it every time and notes no store,
; as before v4.0
;vbe_blocks = 1
; v4.4: Ctrl+Alt+F11 turns vbe_blocks the other way while the PC runs and
; saves it here; Ctrl+Alt+F10 does the same for pace_quiet
; v4.4: a picture waits until the guest has drawn nothing for this many of
; its instructions, at most pace_wait_ms; 0, the default, draws on time
; (BUILD-NOTES 29).  The DOS board has one frame buffer: no double_buffer
;pace_quiet = 0
;pace_wait_ms = 15

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; the most there is room for beside vga_mem_size (the boot console says how
; much that is)
mem_size = max
; video memory for one 800x600 screen: 1M for High Color (16 bit), the
; default (960K is just enough too); 1408K for True Color (24 bit); 1920K
; for True Color (32 bit).  Each of these was run on the PC to the desktop.
; With less than a screen's worth (768K at 16 bits, say) Windows falls back
; to 640x480.  More video memory leaves less for the guest.
vga_mem_size = 1M
hda = /sdcard3/win95.img
; stops Windows falling back to "MS-DOS compatibility mode" for the disk
fill_cmos = 1
; only while installing the display driver (TEST-PLAN.md 13): take the ;
; off both, with the two floppy images beside this ini; put them back after.
; vbe-reg.img in A:, the driver's disk in B: (in A: it stops the start at
; "Invalid system disk")
;fda = vbe-reg.img
;fdb = vmdisp9x-1.2025.0.119b-driver-2d.img

[cpu]
; as the image was made (tiny386's Windows build, cpu gen 3, no FPU)
gen = 3
fpu = 0
