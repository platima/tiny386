; membench: the board's memory measured once (v5.2); image the card first
; Pick this in the boot menu to measure the Korvo-1's PSRAM, cache and DMA
; once.  It does not start the PC.  About half a minute; the lines show on
; the panel as they come, and MEMBENCH.TXT is written beside this file at
; the end (nothing goes to the card before that).  Then press RESET.
;
; It tries a cache setting nobody has documented (a preload that does not
; load), so image the card before the first run.  The PC's memory is not
; touched: the PC is not built.

[esp]
console = 2
enable_usb = 1
membench = 1
