; Windows 95 OSR2 from the card's partition 3, raw (v4.4, the new card)
; For tiny386 v4.4 bare metal on the Korvo-1, with a card laid out by
; s31/newcard (TEST-PLAN.md 16): Windows' own FAT16 volume on p3, no
; win95.img file.  The same Windows as win95-800x480.ini (the display
; driver and all, if it was in the image newcard.sh copied).  Put it in the
; card's tiny386 folder beside tiny386.ini; the boot menu lists it.
;
; hda = sd:3 gives the guest card partition 3 whole, read and written raw:
; its disk has that partition alone in its table, and nothing else on the
; card can be written through it.  The firmware unmounts p3 from /sdcard3
; for it, so nothing else here may name a file on p3.  It refuses p1, where
; this ini is, Linux's root (p2), and any partition not FAT16 or FAT32;
; and (v4.5) the old card's WIN9X partition, the one holding win95.img, so
; copy this ini only to a card made by newcard.sh.
; With tiny386 off, p3 is an ordinary FAT16 drive on a PC (chkdsk, copying
; files to and from it) and on the board's Linux.

[esp]
console = 2
enable_usb = 1
; v5.2 net, the v5.2-net build only (the others say Wi-Fi is not in them):
; a 2.4 GHz access point, such as a phone's hotspot, joined at boot, through
; which the guest's NE2000 (I/O 300h, IRQ 9) reaches the network.  Without
; an ssid, Wi-Fi is not started.  Take the ; off both and fill them in
;ssid =
;pass =
; the status LED's brightness, 0 to 255; 9 without this line (tiny386.ini)
;led_brightness = 9
; each line below is what it is without the line (tiny386.ini and
; win95-800x480.ini say more)
;uart_log = 0
;verbose_log = 0
;timer_catchup = 1
;memtest = 0
; v5.2: 1 sets the SD card's clock only when it is not right already, and
; (v5.3) the slot's width, sampling and delays only when they change; 0
; sets them all again before every command, as before v5.2
;sd_clock_fix = 1
; v5.3: 1 asks the card again after a write as soon as it is ready (D0),
; and not at all after a read; 0 as ESP-IDF does it, as before v5.3
;sd_wait_fix = 1
; v5.2: a disk command's blocks gathered and read ahead, so the card gets
; a few big reads and writes (1); 0 every block on its own, as before
;ide_buffer = 1
;vbe_blocks = 1
; v4.4: Ctrl+Alt+F11, F10 and F9 turn vbe_blocks, pace_quiet and
; double_buffer the other way while the PC runs and save them here
;pace_quiet = 0
;pace_wait_ms = 15
;double_buffer = 0
; v5.0: 1 runs the guest through the fast interpreter in front of
; tiny386's own (from tab5-pc, by Yejun Yang); 0 through tiny386's own
; alone, which since v5.1 runs from internal RAM again, as in v4.6.  The
; guest sees the same either way (s31/FAST-CPU.md)
;fast_cpu = 1
; v5.1: 1 samples where core 1's time goes, from core 0, and writes
; PROFILE.TXT into the card's tiny386 folder every minute (Ctrl+Alt+F8
; writes one at once); 0, the default, sets nothing up (s31/PROFILE.md)
;profile = 0

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; the most there is room for beside vga_mem_size (the boot console says how
; much that is)
mem_size = max
; video memory for one 800x480 screen in High Color (win95-800x480.ini
; lists the others); 320K is enough for Windows' standard 16-colour driver
vga_mem_size = 768K
hda = sd:3
; stops Windows falling back to "MS-DOS compatibility mode" for the disk
fill_cmos = 1

[cpu]
; as the image was made (tiny386's Windows build, cpu gen 3, no FPU)
gen = 3
fpu = 0
