; Windows 95 OSR2 from the card's partition 3, raw (v4.4, the new card)
; For tiny386 v4.4 bare metal on the Korvo-1, with a card laid out by
; s31/newcard (TEST-PLAN.md 16): Windows' own FAT16 volume on p3, no
; win95.img file.  The same Windows as win95-800x480.ini (the display
; driver and all, if it was in the image newcard.sh copied).  Put it in the
; card's tiny386 folder beside tiny386.ini; the boot menu lists it.
;
; hda = sd:3 gives the guest card partition 3 whole, read and written raw:
; its disk has that partition alone in its table, and nothing else on the
; card can be written through it.  The firmware unmounts p3 from /sdcard3
; for it, so nothing else here may name a file on p3.  It refuses p1, where
; this ini is, Linux's root (p2), and any partition not FAT16 or FAT32.
; With tiny386 off, p3 is an ordinary FAT16 drive on a PC (chkdsk, copying
; files to and from it) and on the board's Linux.

[esp]
console = 2
enable_usb = 1
; the status LED's brightness, 0 to 255; 9 without this line (tiny386.ini)
;led_brightness = 9
; each line below is what it is without the line (tiny386.ini and
; win95-800x480.ini say more)
;uart_log = 0
;verbose_log = 0
;timer_catchup = 1
;memtest = 0
;vbe_blocks = 1
; v4.4: Ctrl+Alt+F11, F10 and F9 turn vbe_blocks, pace_quiet and
; double_buffer the other way while the PC runs and save them here
;pace_quiet = 0
;pace_wait_ms = 15
;double_buffer = 0

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; the most there is room for beside vga_mem_size (the boot console says how
; much that is)
mem_size = max
; video memory for one 800x480 screen in High Color (win95-800x480.ini
; lists the others); 320K is enough for Windows' standard 16-colour driver
vga_mem_size = 768K
hda = sd:3
; stops Windows falling back to "MS-DOS compatibility mode" for the disk
fill_cmos = 1

[cpu]
; as the image was made (tiny386's Windows build, cpu gen 3, no FPU)
gen = 3
fpu = 0
