; Windows 95 OSR2 from win95.img on the WIN9X partition, 14 MB
; For tiny386 v3 bare metal on the Korvo-1 (14 MB is too much for the Linux
; route, whose own win95.ini asks for 4M).  Put it in the card's tiny386
; folder beside tiny386.ini; the boot menu lists it.
;
; The firmware mounts every FAT partition of the card: the first at /sdcard,
; each other one at /sdcardN, N its number in the partition table.  The
; WIN9X partition is the third (p3, from sector 532480), so /sdcard3.
; hda = /mnt/win/win95.img means the same here (the partition labelled
; WIN9X), as on the Linux route.

[esp]
console = 2
enable_usb = 1
; the status LED's brightness, 0 to 255; 9 without this line (tiny386.ini)
;led_brightness = 9
; v3.8: each line below is what it is without the line (tiny386.ini says
; more; TEST-PLAN.md 8 for Windows 95)
; the log on the UART too while the PC runs (through a queue)
;uart_log = 0
; every line the emulator logs (1), or the first 5 of a kind in 5 s (0)
;verbose_log = 0
; 1: timer ticks missed while the emulator waits are dropped, as a real PC
; drops them; 0 makes up every one, as before v3.8 (Windows 95 can crash)
;timer_catchup = 1
; the image's clusters mapped at start (1); 0 as before v3.8
;fast_seek = 1
; passes of a PSRAM test before the PC starts, about a second each: for
; one boot, memtest = 3, then put the ; back
;memtest = 0
; v4.4: Ctrl+Alt+F10 and Ctrl+Alt+F9 turn the next two settings the other
; way while the PC runs and save them here (the console says what was saved)
; v4.4: a picture waits until the guest has drawn nothing for this many of
; its instructions, at most pace_wait_ms; 0, the default, draws on time.
; 5000 keeps out pictures caught part way through Windows' drawing, and
; anything that draws without a pause gets a third fewer (BUILD-NOTES 29)
;pace_quiet = 0
;pace_wait_ms = 15
; v4.4: 1 draws into a second frame buffer and shows it at the panel's
; frame, so that no frame is torn between two pictures; it takes 750 KiB of
; the emulator's memory, which can leave the guest 1M less (the boot
; console's mem_size line says what it gets)
;double_buffer = 0
; v5.0: 1 runs the guest through the fast interpreter in front of
; tiny386's own (from tab5-pc, by Yejun Yang); 0 through tiny386's own
; alone, as v4.6.  The guest sees the same either way (s31/FAST-CPU.md)
;fast_cpu = 1

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; the most this firmware fits beside vga_mem_size 320K (the boot console
; says how much there is; "mem_size = max" also gives the most that fits,
; and a mem_size too big is lowered to that, with a yellow line)
mem_size = 14M
; 256K is enough for Windows' standard 16-colour VGA driver; 320K leaves
; room for 640x480 in 256 colours with a VBE driver later.  Not for an
; image with VMDisp9x set to 800x480 (TEST-PLAN.md 13): with 320K Windows
; says its display settings are wrong and runs at 640x480.
; Start such an image with win95-800x480.ini.
vga_mem_size = 320K
hda = /sdcard3/win95.img
; stops Windows falling back to "MS-DOS compatibility mode" for the disk
fill_cmos = 1

[cpu]
; as the image was made (tiny386's Windows build, cpu gen 3, no FPU)
gen = 3
fpu = 0
