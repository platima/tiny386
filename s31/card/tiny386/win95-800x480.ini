; Windows 95 OSR2 at the panel's own size, 800x480 (v4.0)
; For tiny386 v4.0 bare metal on the Korvo-1, with VMDisp9x's display driver
; (TEST-PLAN.md 13: what to install and how).  The same image as
; win95-14m.ini, which keeps Windows' standard 640x480 VGA driver.  Put it in
; the card's tiny386 folder beside tiny386.ini; the boot menu lists it.
;
; The firmware mounts every FAT partition of the card: the first at /sdcard,
; each other one at /sdcardN, N its number in the partition table.  The
; WIN9X partition is the third (p3, from sector 532480), so /sdcard3.
;
; v4.1: once the driver is in the image, start it with this ini only.  With
; win95-14m.ini's 320K Windows says its display settings are wrong and runs
; at 640x480; started with this ini again it is back at 800x480
; (TEST-PLAN.md 13c).

[esp]
console = 2
enable_usb = 1
; the status LED's brightness, 0 to 255; 9 without this line (tiny386.ini)
;led_brightness = 9
; v3.8: each line below is what it is without the line (tiny386.ini says
; more; TEST-PLAN.md 8 for Windows 95)
;uart_log = 0
;verbose_log = 0
;timer_catchup = 1
;fast_seek = 1
;memtest = 0
; v4.0: 1 draws a VBE picture (Windows at 800x480) again only where Windows
; wrote into video memory; 0 draws all of it every time and (v4.1) notes no
; store, as before v4.0
;vbe_blocks = 1

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; the most there is room for beside vga_mem_size (the boot console says how
; much that is)
mem_size = max
; video memory for one 800x480 screen: 768K for High Color (16 bit), the
; default; 1152K for True Color (24 bit); 1536K for True Color (32 bit).
; More video memory leaves less for the guest: the boot console's
; "Emulator memory" line says how much there is, and at 768K the guest
; gets 14M if that is 15,120 KiB or more, else 13M.
vga_mem_size = 768K
hda = /sdcard3/win95.img
; stops Windows falling back to "MS-DOS compatibility mode" for the disk
fill_cmos = 1
; only while installing the display driver (TEST-PLAN.md 13): take the ;
; off both, with the two floppy images beside this ini; put them back after.
; vbe-reg.img in A:, the driver's disk in B: (in A: it stops the start at
; "Invalid system disk")
;fda = vbe-reg.img
;fdb = vmdisp9x-1.2025.0.119b-driver-2d.img

[cpu]
; as the image was made (tiny386's Windows build, cpu gen 3, no FPU)
gen = 3
fpu = 0
