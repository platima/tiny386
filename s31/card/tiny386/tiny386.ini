; FreeDOS from freedos-hd.img, 4 MB (enough for BENCH): the first boot
; For tiny386 v3 bare metal on the Korvo-1.  Put it in the card's tiny386
; folder with bios.bin, vgabios.bin and freedos-hd.img.  The first line above
; is what the boot menu shows; with more than one ini in the folder the menu
; comes up, and this one (tiny386.ini) starts after 6 s if no key is pressed.
; A file name without a / in front is looked for beside this ini.

[esp]
; seconds the boot console stays up before the PC starts (10 if anything
; on it is yellow or red); time to read it, or to photograph it
console = 2
; the USB keyboard and mouse (1 is also what it is without this line)
enable_usb = 1
; the status LED's brightness, 0 (dark, even in a crash) to 255 (full);
; 9 without this line.  Take the ; off the next line to set it
; (STATUS-LED.md, section 7)
;led_brightness = 9
; v3.8: each line below is what it is without the line; take the ; off to
; change one (BUILD-NOTES.md 19.5 and 20.4)
; the log on the UART too while the PC runs, through a queue the emulator
; never waits for; 0: the ring and the panel only (Ctrl+Alt+F12 shows it)
;uart_log = 0
; 1: every line the emulator logs while the PC runs; 0: of each kind of
; line the first 5 in 5 s, the rest counted in one line
;verbose_log = 0
; timer ticks missed while the emulator waits: 1 dropped as a real PC drops
; them; 0 every one made up afterwards, as before v3.8 (Windows 95 can crash
; on that)
;timer_catchup = 1
; the disk images' clusters mapped at start (1); 0 as before v3.8
;fast_seek = 1
; passes of a PSRAM test before the PC starts, about a second each; 0 none
;memtest = 0
; v5.0: 1 runs the guest through the fast interpreter in front of
; tiny386's own (from tab5-pc, by Yejun Yang); 0 through tiny386's own
; alone, which since v5.1 runs from internal RAM again, as in v4.6.  The
; guest sees the same either way (s31/FAST-CPU.md)
;fast_cpu = 1
; v5.1: 1 samples where core 1's time goes, from core 0, and writes
; PROFILE.TXT into the card's tiny386 folder every minute (Ctrl+Alt+F8
; writes one at once); 0, the default, sets nothing up (s31/PROFILE.md)
;profile = 0

[pc]
bios = bios.bin
vga_bios = vgabios.bin
; FreeDOS needs very little; BENCH.COM on the image wants 4 MB
mem_size = 4M
vga_mem_size = 256K
hda = freedos-hd.img
fill_cmos = 1

[cpu]
; 3, 4, 5 or 6: 386, 486, 586 or 686
gen = 4
; no x87: the S31 has no FPU of its own for the emulator to lean on
fpu = 0
