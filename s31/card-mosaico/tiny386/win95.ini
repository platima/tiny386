; Windows 95 on the ESP-Mosaico (s31/MOSAICO.md).  This folder goes onto the
; TINY386 drive in USB disk mode (hold the AI button while switching on),
; with bios.bin and vgabios.bin beside this file.
;
; The guest's hard disk is the whole NAND (hda = nand:), 119,279,616 bytes,
; written in USB disk mode with the Windows image.
;
; The panel shows 480x480: Windows at 480x480 fills it; at 640x480 the AI
; button (or Ctrl+Alt+F7) changes between the whole picture at 3/4 and 480
; of its 640 columns following the mouse.  Ctrl+Alt+F6, or the AI button
; held 3 s, goes to USB disk mode (shut Windows down first).
[esp]
console = 2
enable_usb = 1
; the panel's clock: 40 MHz, Espressif's own, unless this says otherwise.
; 48, 53, 60, 68 and 80 are the faster clocks the board can make; at 80 it
; showed a stray pixel here and there.  Ctrl+Alt+F5 steps through them
; while the PC runs (Ctrl+Alt+F12 says which), so the fastest clean one can
; be found and then kept here.
;lcd_mhz = 60
; the drive strength of the panel's lines, 0 (weakest) to 3: 2, Espressif's,
; unless this says otherwise (Ctrl+Alt+F4 steps it while the PC runs)
;lcd_drive = 3
; the panel's brightness, 1 to 100 per cent: 100 unless this says otherwise.
; Lower is easier on the battery.
;lcd_brightness = 60
; the speaker's volume, 0 (off) to 100: 80 unless this says otherwise.
; Windows' own volume control works within it.
;volume = 80
; Wi-Fi, in the network build (NET.md): a 2.4 GHz network
;ssid = the network's name
;pass = its password
[pc]
bios = bios.bin
vga_bios = vgabios.bin
; the most there is room for beside vga_mem_size (the boot console says how
; much that is)
mem_size = max
; video memory: 480x480 in High Color (16 bit) takes 450 KB; 640K leaves
; room for 640x480 in High Color (600 KB) too.  512K gives Windows 128 KB
; more memory, but 640x480 only in 256 colours.
vga_mem_size = 640K
hda = nand:
fill_cmos = 1
; text in 8-dot characters, 640 wide, is this board's default: 80 columns
; of 9 dots (720) are wider than its 640-pixel frame
;vga_force_8dm = 0
[cpu]
gen = 5
fpu = 1
